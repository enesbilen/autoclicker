[package]
name = "autoclicker"
version = "0.3.0"
edition = "2021"

[dependencies]
eframe = "0.29"
enigo = "0.2"
device_query = "2"
spin_sleep = "1"
ureq = { version = "2", features = ["json"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
