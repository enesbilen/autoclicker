name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: autoclicker-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: autoclicker-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: autoclicker-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Rename (unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/autoclicker ${{ matrix.asset }}
      - name: Rename (windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\autoclicker.exe ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true
